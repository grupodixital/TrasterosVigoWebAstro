server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sits behind Traefik terminating TLS: nginx only sees plain HTTP on
    # port 8080, so its automatic redirect for a directory URI missing the
    # trailing slash (e.g. /contacto -> /contacto/) would otherwise emit an
    # absolute Location built from its own scheme/host/port
    # (http://...:8080/contacto/), breaking every such link. A relative
    # Location lets the browser resolve it against the real external
    # https:// origin instead.
    absolute_redirect off;

    # add_header does not inherit into a location that sets its own
    # add_header, so these four are repeated in every location below
    # that needs a custom Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Astro's hashed, content-addressed build assets: safe to cache forever
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Un-hashed static assets from /public: cache, but allow revalidation
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /robots.txt {
        access_log off;
    }

    # Astro's "directory" build format: /route -> /route/index.html
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml font/woff2;
}
